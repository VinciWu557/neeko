<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>代码注释翻译 — 原型（三层抽象：节点 → 逻辑块 → 段）</title>
<style>
  :root {
    --bg-primary: #26292F;
    --bg-secondary: #181A1C;
    --bg-tertiary: #333337;
    --bg-hover: #3b3b40;
    --bg-selected: #44444a;
    --border: #3b3b40;
    --text-primary: #ffffff;
    --text-secondary: #cccccc;
    --text-muted: #999999;
    --muted-strong: #6b7280;
    --accent-blue: #2997ff;
    --accent-blue-rgb: 41, 151, 255;
    --accent-green: #30d158;
    --accent-green-rgb: 48, 209, 88;
    --accent-yellow: #ffd60a;
    --accent-orange: #ff9f0a;
    --accent-red: #ff453a;
    --accent-red-rgb: 255, 69, 58;
    --accent-purple: #bf5af2;
    --mono-fg: #abb2bf;
    --mono-fg-dim: #5c6370;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
    --radius: 6px;
    --cm-keyword: #c678dd;
    --cm-comment: #5c6370;
    --cm-string: #98c379;
    --cm-number: #d19a66;
    --cm-fn: #61afef;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg-primary); color: var(--text-primary);
    font-family: var(--font-ui); font-size: 13px; line-height: 1.5;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* Titlebar */
  .titlebar {
    flex: 0 0 auto; height: 38px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: var(--bg-secondary);
    border-bottom: 1px solid var(--border); user-select: none;
  }
  .titlebar .logo {
    width: 16px; height: 16px; border-radius: 4px;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  }
  .titlebar .app-name { font-size: 12px; font-weight: 600; }
  .titlebar .file-path {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
    padding-left: 10px; border-left: 1px solid var(--border);
  }
  .titlebar .spacer { flex: 1; }
  .titlebar .badge-proto {
    font-size: 10px; color: var(--accent-orange);
    border: 1px solid rgba(255,159,10,0.4); background: rgba(255,159,10,0.1);
    border-radius: 20px; padding: 2px 9px; letter-spacing: 0.04em;
  }

  /* Toolbar */
  .toolbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 14px; background: rgba(24,26,28,0.5);
    border-bottom: 1px solid rgba(59,59,64,0.6);
  }
  .btn, .select {
    font-family: inherit; font-size: 11.5px; color: var(--text-secondary);
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 5px 9px; outline: none; cursor: pointer;
  }
  .btn:hover, .select:hover { background: var(--bg-tertiary); }
  .btn:focus-visible, .select:focus-visible { border-color: var(--accent-blue); }
  .btn.primary { color: #fff; background: var(--accent-blue); border-color: var(--accent-blue); font-weight: 500; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { color: var(--accent-red); border-color: rgba(var(--accent-red-rgb),0.4); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .seg button {
    font-family: inherit; font-size: 11px; padding: 4px 10px;
    background: var(--bg-secondary); color: var(--text-muted);
    border: none; border-right: 1px solid var(--border); cursor: pointer; outline: none;
  }
  .seg button:last-child { border-right: none; }
  .seg button:hover { background: var(--bg-tertiary); color: var(--text-secondary); }
  .seg button[aria-pressed="true"] { background: rgba(var(--accent-blue-rgb),0.18); color: var(--accent-blue); font-weight: 600; }

  .toolbar .sep { width: 1px; height: 18px; background: var(--border); }
  .toolbar .spacer { flex: 1; }

  .stat-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-mono); font-size: 10.5px;
    padding: 3px 8px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-muted);
  }
  .stat-pill b { font-weight: 600; }
  .stat-pill.translated b { color: var(--accent-green); }
  .stat-pill.code b { color: var(--accent-purple); }
  .stat-pill.skipped b { color: var(--accent-yellow); }
  .stat-pill.failed b { color: var(--accent-red); }

  /* Editor */
  .editor-wrap { flex: 1; display: flex; min-height: 0; }
  .editor-scroll { flex: 1; overflow: auto; min-width: 0; }
  .editor {
    display: flex; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55;
    padding: 12px 0 40vh; min-width: min-content;
  }
  .gutter {
    flex: 0 0 auto; padding: 0 10px 0 14px; text-align: right;
    color: var(--mono-fg-dim); user-select: none; font-size: 11.5px; line-height: 1.55;
  }
  .code { flex: 1; padding-right: 24px; min-width: 0; }
  .row { display: flex; white-space: pre; min-height: 19.4px; }
  .row:hover { background: rgba(255,255,255,0.022); }

  .tok-kw { color: var(--cm-keyword); }
  .tok-str { color: var(--cm-string); }
  .tok-num { color: var(--cm-number); }
  .tok-fn { color: var(--cm-fn); }
  .tok-punc { color: var(--mono-fg); }

  /* 注释原文：按 segment 种类区分 */
  .seg-prose { color: var(--cm-comment); }
  .seg-code {
    color: var(--cm-comment);
    background: rgba(191,90,242,0.10);
    border-left: 2px solid rgba(191,90,242,0.45);
    display: inline-block;
  }
  .seg-fence {
    color: var(--cm-comment);
    background: rgba(191,90,242,0.13);
    border-left: 2px solid rgba(191,90,242,0.55);
    display: inline-block;
  }
  .seg-tag { color: var(--accent-purple); opacity: 0.92; }

  .seg-mark {
    font-size: 9px; letter-spacing: 0.03em; text-transform: uppercase;
    padding: 0 4px; border-radius: 3px; margin-left: 8px;
    font-family: var(--font-ui); vertical-align: middle;
  }
  .seg-mark.code { color: var(--accent-purple); background: rgba(191,90,242,0.16); }
  .seg-mark.fence { color: var(--accent-purple); background: rgba(191,90,242,0.2); }
  .seg-mark.tag { color: var(--accent-purple); background: rgba(191,90,242,0.12); }

  /* 译文装饰 */
  .tr-below { display: flex; white-space: pre-wrap; padding: 1px 0; margin: 1px 0 2px; }
  .tr-below .tr-body {
    flex: 1; min-width: 0; color: var(--text-primary);
    border-left: 2px solid rgba(var(--accent-blue-rgb),0.5);
    padding: 1px 0 1px 8px;
    font-family: var(--font-ui); font-size: 12px; line-height: 1.6;
    background: rgba(var(--accent-blue-rgb),0.055); border-radius: 0 3px 3px 0;
  }
  .tr-below .tr-body .code-gap {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: rgba(191,90,242,0.78);
    background: rgba(191,90,242,0.10);
    border: 1px dashed rgba(191,90,242,0.35);
    border-radius: 3px;
    padding: 0 6px;
    margin: 1px 0;
  }
  .tr-below .tr-body .cmt-mark { color: rgba(var(--accent-blue-rgb),0.55); font-family: var(--font-mono); font-size: 11.5px; }

  .tr-inline {
    display: inline; margin-left: 14px; color: var(--text-primary);
    background: rgba(var(--accent-blue-rgb),0.12); border-radius: 3px;
    padding: 1px 7px; font-family: var(--font-ui); font-size: 11.5px;
  }
  .tr-inline::before { content: '→ '; color: rgba(var(--accent-blue-rgb),0.7); }

  .row.hoverable { position: relative; }
  .row.hoverable:hover .tr-hover { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .tr-hover {
    position: absolute; left: 28px; top: 100%; z-index: 30; max-width: 560px;
    padding: 7px 10px; background: var(--bg-tertiary);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 10px 28px rgba(0,0,0,0.5); color: var(--text-primary);
    font-family: var(--font-ui); font-size: 12px; line-height: 1.65; white-space: pre-wrap;
    opacity: 0; transform: translateY(-3px); transition: opacity 120ms ease, transform 120ms ease;
    pointer-events: none;
  }

  .tr-shimmer {
    display: inline-block; height: 12px; width: 120px; border-radius: 3px;
    background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-hover) 50%, var(--bg-tertiary) 75%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite linear;
    margin-left: 10px; vertical-align: middle;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .tr-fail {
    display: inline-flex; align-items: center; gap: 6px; margin-left: 12px;
    font-size: 10.5px; font-family: var(--font-mono); color: var(--accent-red);
    background: rgba(var(--accent-red-rgb),0.1); border: 1px solid rgba(var(--accent-red-rgb),0.3);
    border-radius: 20px; padding: 1px 8px; cursor: pointer;
  }
  .tr-fail:hover { background: rgba(var(--accent-red-rgb),0.2); }

  .skip-chip {
    display: inline-flex; align-items: center; gap: 4px; margin-left: 12px;
    font-size: 10px; font-family: var(--font-ui); color: var(--accent-yellow);
    background: rgba(255,214,10,0.1); border: 1px solid rgba(255,214,10,0.28);
    border-radius: 20px; padding: 1px 8px; cursor: help;
  }

  /* Inspect panel */
  .inspect {
    flex: 0 0 330px; background: var(--bg-secondary);
    border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0;
  }
  .inspect-head {
    flex: 0 0 auto; padding: 10px 12px 8px;
    border-bottom: 1px solid rgba(59,59,64,0.6);
  }
  .inspect-title {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .inspect-sub { font-size: 10.5px; color: var(--text-muted); margin-top: 5px; line-height: 1.65; }
  .inspect-sub b { color: var(--accent-purple); }
  .inspect-body { flex: 1; overflow-y: auto; padding: 8px; }

  .layer-hint {
    font-size: 9.5px; font-family: var(--font-mono);
    color: var(--muted-strong); margin: 2px 0 6px; padding-left: 2px;
  }

  .grp-card {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px; margin-bottom: 8px; background: var(--bg-primary);
  }
  .grp-card-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .grp-ln {
    font-family: var(--font-mono); font-size: 9.5px; color: var(--muted-strong);
    background: rgba(107,114,128,0.14); padding: 0 4px; border-radius: 3px;
  }
  .grp-kind {
    font-size: 9.5px; letter-spacing: 0.03em; padding: 0 5px;
    border-radius: 3px; text-transform: uppercase;
  }
  .grp-kind.doc { color: var(--accent-purple); background: rgba(191,90,242,0.14); }
  .grp-kind.prose { color: var(--accent-blue); background: rgba(var(--accent-blue-rgb),0.14); }
  .grp-kind.directive { color: var(--accent-yellow); background: rgba(255,214,10,0.14); }
  .grp-kind.shebang { color: var(--accent-orange); background: rgba(255,159,10,0.14); }
  .grp-kind.license { color: var(--accent-green); background: rgba(var(--accent-green-rgb),0.14); }
  .grp-card-head .spacer { flex: 1; }
  .grp-addr { font-family: var(--font-mono); font-size: 9px; color: var(--muted-strong); }

  .seg-list { display: flex; flex-direction: column; gap: 3px; }
  .seg-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; font-family: var(--font-mono);
    padding: 2px 5px; border-radius: 3px;
    background: rgba(255,255,255,0.02);
  }
  .seg-item .tag {
    font-family: var(--font-ui); font-size: 9px; padding: 0 4px; border-radius: 2px; flex: 0 0 auto;
  }
  .seg-item .tag.prose { color: var(--accent-blue); background: rgba(var(--accent-blue-rgb),0.16); }
  .seg-item .tag.code { color: var(--accent-purple); background: rgba(191,90,242,0.18); }
  .seg-item .tag.fence { color: var(--accent-purple); background: rgba(191,90,242,0.24); }
  .seg-item .tag.blank { color: var(--muted-strong); background: rgba(107,114,128,0.2); }
  .seg-item .tag.tag { color: var(--accent-purple); background: rgba(191,90,242,0.12); }
  .seg-item .txt {
    flex: 1; color: var(--text-muted); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .seg-item.skipped .txt { color: var(--muted-strong); text-decoration: line-through; opacity: 0.75; }
  .seg-item .sent { font-size: 9px; color: var(--muted-strong); flex: 0 0 auto; }
  .seg-item .sent.yes { color: var(--accent-green); }

  .note-strip {
    flex: 0 0 auto; margin: 8px; padding: 8px 10px; border-radius: var(--radius);
    border: 1px solid rgba(191,90,242,0.28); background: rgba(191,90,242,0.06);
    font-size: 10.5px; color: var(--text-secondary); line-height: 1.7;
  }
  .note-strip b { color: var(--accent-purple); }
  .note-strip code {
    font-family: var(--font-mono); font-size: 10px;
    background: rgba(255,255,255,0.07); padding: 1px 3px; border-radius: 3px;
  }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 7px 14px; font-size: 11.5px; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    opacity: 0; pointer-events: none; z-index: 60;
    transition: opacity 160ms ease, transform 160ms ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .scroll-thin::-webkit-scrollbar { width: 9px; height: 9px; }
  .scroll-thin::-webkit-scrollbar-thumb {
    background: var(--bg-selected); border-radius: 5px;
    border: 2px solid transparent; background-clip: padding-box;
  }
</style>
</head>
<body>

<div class="titlebar">
  <div class="logo"></div>
  <span class="app-name">Neeko</span>
  <span class="file-path">src / features / translation / engine.ts</span>
  <span class="spacer"></span>
  <span class="badge-proto">原型 · 非最终 UI</span>
</div>

<div class="toolbar">
  <button class="btn primary" id="btn-translate">翻译注释</button>
  <button class="btn danger" id="btn-stop" disabled>停止</button>

  <div class="sep"></div>
  <span style="font-size:11px;color:var(--text-muted)">显示</span>
  <div class="seg" id="seg-mode" role="group" aria-label="译文显示模式">
    <button data-mode="below" aria-pressed="true">对照</button>
    <button data-mode="inline" aria-pressed="false">行内</button>
    <button data-mode="hover" aria-pressed="false">悬停</button>
    <button data-mode="off" aria-pressed="false">关闭</button>
  </div>

  <div class="sep"></div>
  <select class="select" id="sel-lang" aria-label="目标语言">
    <option>简体中文</option>
    <option>繁體中文</option>
    <option>日本語</option>
  </select>

  <span class="spacer"></span>
  <span class="stat-pill translated">已译 <b id="st-done">0</b></span>
  <span class="stat-pill code">代码不翻 <b id="st-code">0</b></span>
  <span class="stat-pill skipped">跳过 <b id="st-skip">0</b></span>
  <span class="stat-pill failed">失败 <b id="st-fail">0</b></span>
</div>

<div class="editor-wrap">
  <div class="editor-scroll scroll-thin" id="editor-scroll">
    <div class="editor">
      <div class="gutter" id="gutter"></div>
      <div class="code" id="code"></div>
    </div>
  </div>

  <aside class="inspect">
    <div class="inspect-head">
      <div class="inspect-title">三层抽象</div>
      <div class="inspect-sub">
        <b>节点</b>（AST）→ <b>逻辑块</b>（行邻接分组）→ <b>段</b>（prose / code / fence / tag）。<br>
        只有 <b style="color:var(--accent-blue)">prose</b> 送模型；
        <b style="color:var(--accent-purple)">code / fence</b> 一律原样保留。
      </div>
    </div>
    <div class="inspect-body scroll-thin" id="inspect-body"></div>
    <div class="note-strip">
      <b>实测事实</b>：连续 <code>//</code> 在语法树里是 <b>N 个独立节点</b>（此处 9 行 = 9 个）。
      逐节点翻译会打散段落，所以必须先按行邻接<b>分组成块</b>，再在块内切段。
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════════
   源码 —— 与真实 parser dump 一致的结构（已实测：
   /** *\/ 是单个 BlockComment；下方 9 行 // 是 9 个独立 LineComment 合成 1 组）
   ══════════════════════════════════════════════════════════════════ */

var SRC = [
  /*  0 */ { t: 'com', id: 'g0', kind: 'doc', node: 'BlockComment',
             lines: ['/**',
                     ' * Translate a batch of segments through one agent turn.',
                     ' *',
                     ' * @param segments the numbered source segments',
                     ' * @returns the translated strings, aligned by index',
                     ' */'] },

  /*  1 */ { t: 'code', html: '<span class="tok-kw">export async function</span> <span class="tok-fn">translateBatch</span><span class="tok-punc">(</span>segments<span class="tok-punc">,</span> turn<span class="tok-punc">) {</span>' },

  // 组 g1：9 个独立 LineComment 节点（混排散文 + 代码 + 围栏）
  /*  2 */ { t: 'com', id: 'g1', node: 'LineComment', kind: 'prose',
             lines: ['// Replace the legacy call:'] },
  /*  3 */ { t: 'com', id: 'g1', node: 'LineComment', kind: 'prose',
             lines: ['//   const raw = await legacyFetch(segments);'] },
  /*  4 */ { t: 'com', id: 'g1', node: 'LineComment', kind: 'prose',
             lines: ['//   if (raw.error) { throw raw.error; }'] },
  /*  5 */ { t: 'com', id: 'g1', node: 'LineComment', kind: 'prose',
             lines: ['// with the single-turn path.'] },
  /*  6 */ { t: 'com', id: 'g1', node: 'LineComment', kind: 'prose',
             lines: ['//'] },
  /*  7 */ { t: 'com', id: 'g1', node: 'LineComment', kind: 'prose',
             lines: ['// Usage:'] },
  /*  8 */ { t: 'com', id: 'g1', node: 'LineComment', kind: 'prose',
             lines: ['// ```ts'] },
  /*  9 */ { t: 'com', id: 'g1', node: 'LineComment', kind: 'prose',
             lines: ['// const out = await translateBatch(segs, turn);'] },
  /* 10 */ { t: 'com', id: 'g1', node: 'LineComment', kind: 'prose',
             lines: ['// ```'] },

  /* 11 */ { t: 'code', html: '  <span class="tok-kw">return</span> <span class="tok-fn">run</span><span class="tok-punc">(</span>turn<span class="tok-punc">);</span>' },
  /* 12 */ { t: 'code', html: '<span class="tok-punc">}</span>' },
  /* 13 */ { t: 'blank' },

  /* 14 */ { t: 'com', id: 'g2', kind: 'shebang', node: 'LineComment',
             lines: ['#!/usr/bin/env node'] },
  /* 15 */ { t: 'com', id: 'g3', kind: 'license', node: 'LineComment',
             lines: ['// Copyright 2026 Neeko. SPDX-License-Identifier: Apache-2.0'] },
  /* 16 */ { t: 'blank' },

  /* 17 */ { t: 'com', id: 'g4', kind: 'directive', node: 'LineComment',
             lines: ['// eslint-disable-next-line no-restricted-imports'] },
  /* 18 */ { t: 'code', html: '<span class="tok-kw">import</span> <span class="tok-punc">{</span> invoke <span class="tok-punc">}</span> <span class="tok-kw">from</span> <span class="tok-str">\'@tauri-apps/api/core\'</span><span class="tok-punc">;</span>' },
  /* 19 */ { t: 'blank' },

  /* 20 */ { t: 'com', id: 'g5', kind: 'prose', node: 'LineComment',
             lines: ['// if (cache.has(addr)) { return cache.get(addr); }'], trailing: true },
  /* 21 */ { t: 'code', html: '<span class="tok-kw">export function</span> <span class="tok-fn">cacheKey</span><span class="tok-punc">(</span>profile<span class="tok-punc">,</span> lang<span class="tok-punc">,</span> addr<span class="tok-punc">) {</span>' },
  /* 22 */ { t: 'code', html: '  <span class="tok-kw">return</span> <span class="tok-str">`${profile}|${lang}|${addr}`</span><span class="tok-punc">;</span>' },
  /* 23 */ { t: 'code', html: '<span class="tok-punc">}</span>' },
  /* 24 */ { t: 'blank' },

  /* 25 */ { t: 'com', id: 'g6', kind: 'prose', node: 'LineComment',
             lines: ['// Placeholders like {0} and %s must survive verbatim.'] }
];

/* ══════════════════════════════════════════════════════════════════
   段切分（segmentBlock.ts 的等价实现）
   —— 本任务最核心逻辑：同一注释块内，代码段不翻、散文段翻
   ══════════════════════════════════════════════════════════════════ */

var CODE_START = /^(if|for|while|return|const|let|var|fn|def|class|import|from|export|function|struct|impl|pub|use|async|await|func|package|throw|new)\b/;
var CODE_SYMBOL = /(\(\);|=>|===|!==|&&|\|\||\+\+|--|\+=|-=|\/\/|::|->|\[\]|\bawait\b)/;
var CODE_TAIL = /[;{}]\s*$/;
var LEADING_PROSE = /^(Usage|Example|Examples|e\.g\.|For example|例如|示例)[:：]?\s*$/i;

function stripMarker(line) {
  // 先去掉缩进：块注释的行形如 ` * @param x`，标记前有空格
  var s = line.replace(/^\s+/, '');
  s = s.replace(/^(?:\/\/\/|\/\/|#!|#|\/\*\*|\/\*|\*\/|\*)/, '');
  return s.replace(/^\s?/, '');
}

function classifySegment(rawLine, prevKind) {
  var body = stripMarker(rawLine).trim();

  // 围栏标记
  if (/^(```|~~~)/.test(body)) return 'fence';

  // 空行
  if (!body) return 'blank';

  // doc 标签行
  if (/^@(param|returns?|throws?|type|deprecated|see|example|since|author)\b/.test(body)) return 'tag';
  if (/^:(param|returns?|type|raises?)\s/.test(body)) return 'tag';
  if (/^(Args|Arguments|Returns|Raises|Yields|Attributes|Parameters)[:：]\s*$/.test(body)) return 'tag';

  // 代码判定（偏宽：U2 要求代码一律不翻）
  if (CODE_START.test(body)) return 'code';
  if (CODE_TAIL.test(body) && CODE_SYMBOL.test(body)) return 'code';
  if (CODE_SYMBOL.test(body) && !/\s{1,}[a-z]{3,}\s+[a-z]{3,}\s+[a-z]{3,}/i.test(body)) {
    // 含代码符号且不像「多个英文单词组成的长句」
    if (/[=(){};]/.test(body)) return 'code';
  }
  // 缩进示例块：上一条是 Usage/Example 引导行 → 后续缩进 ≥2 视为代码
  if (prevKind === 'prose-lead' && /^\s{2,}\S/.test(stripMarker(rawLine))) return 'code';

  return 'prose';
}

/**
 * 把一个组切成 segment 序列。
 * 返回 [{kind, lines:[], text}]，kind ∈ prose|code|fence|blank|tag
 */
function segmentBlock(groupLines) {
  var segs = [];
  var fenceOpen = false;
  var prevKind = null;

  for (var i = 0; i < groupLines.length; i++) {
    var line = groupLines[i];
    var body = stripMarker(line).trim();

    if (fenceOpen) {
      segs.push({ kind: 'fence', line: line, text: body });
      if (/^(```|~~~)/.test(body)) fenceOpen = false;
      prevKind = 'fence';
      continue;
    }
    if (/^(```|~~~)/.test(body)) {
      fenceOpen = true;
      segs.push({ kind: 'fence', line: line, text: body });
      prevKind = 'fence';
      continue;
    }

    var kind = classifySegment(line, prevKind);
    segs.push({ kind: kind, line: line, text: body });

    if (kind === 'prose' && LEADING_PROSE.test(body)) prevKind = 'prose-lead';
    else prevKind = kind;
  }
  return segs;
}

var SKIP_BLOCK_KINDS = { shebang: 1, directive: 1, license: 1 };

var KIND_LABEL = {
  shebang: 'shebang', directive: '指令', license: '许可证', doc: '文档注释', prose: '散文'
};
var SKIP_REASON = {
  shebang: '解释器指令，翻了跑不起来',
  directive: '工具链按字面读取',
  license: '法律文本，不由模型改写'
};

/* ══════════════════════════════════════════════════════════════════
   把 SRC 行组装成「组」+ 每组的 segment 列表（对应 groupComments + segmentBlock）
   ══════════════════════════════════════════════════════════════════ */

function buildGroups() {
  var groups = [];
  var byId = {};
  for (var i = 0; i < SRC.length; i++) {
    var line = SRC[i];
    if (line.t !== 'com') continue;
    if (!byId[line.id]) {
      byId[line.id] = { id: line.id, kind: line.kind, node: line.node, lineIndexes: [], lines: [] };
      groups.push(byId[line.id]);
    }
    byId[line.id].lineIndexes.push(i);
    byId[line.id].lines = byId[line.id].lines.concat(line.lines);
  }
  groups.forEach(function (g) { g.segments = segmentBlock(g.lines); });
  return groups;
}

var GROUPS = buildGroups();
var GROUP_OF_LINE = {};
GROUPS.forEach(function (g) { g.lineIndexes.forEach(function (li) { GROUP_OF_LINE[li] = g; }); });

/* 脚本化的模型输出（只对 prose 段；code/fence 段根本不进请求） */
var TRANSLATIONS = {
  'Translate a batch of segments through one agent turn.':
    '通过一次 agent 回合翻译一批片段。',
  'Replace the legacy call:': '替换旧的调用：',
  'with the single-turn path.': '改为单回合路径。',
  'Usage:': '用法：',
  'Placeholders like {0} and %s must survive verbatim.':
    '像 和 %s 这样的占位符必须逐字保留。'  // 故意吞掉 {0} → 触发校验失败
};
var RETRY = {
  'Placeholders like {0} and %s must survive verbatim.':
    '像 {0} 和 %s 这样的占位符必须逐字保留。'
};

/* ══════════════════════════════════════════════════════════════════
   校验（verifyComment.ts 等价）
   ══════════════════════════════════════════════════════════════════ */

var PLACEHOLDERS = [/\{\d+\}/g, /\{\{[\w.]+\}\}/g, /\$\{[\w.]+\}/g, /%\d+\$[sd]/g, /%[sd]/g];

function placeholdersIn(text) {
  var found = [];
  PLACEHOLDERS.forEach(function (re) {
    var m = text.match(new RegExp(re.source, 'g'));
    if (m) found = found.concat(m);
  });
  return found.sort();
}

function verifySegment(src, dst, fenceTexts) {
  if (!dst || !dst.trim()) return { ok: false, reason: 'empty translation' };

  var a = placeholdersIn(src), b = placeholdersIn(dst);
  if (a.join('|') !== b.join('|')) {
    var missing = a.filter(function (p) { return b.indexOf(p) === -1; });
    return { ok: false, reason: 'placeholder lost: ' + (missing.join(' ') || 'set differs') };
  }

  var tags = src.match(/@(?:param|returns?|throws?)\s+(\w+)/g);
  if (tags) {
    for (var i = 0; i < tags.length; i++) {
      if (dst.indexOf(tags[i]) === -1) return { ok: false, reason: 'doc tag lost: ' + tags[i] };
    }
  }

  var sc = (src.match(/`[^`]+`/g) || []).sort().join('|');
  var dc = (dst.match(/`[^`]+`/g) || []).sort().join('|');
  if (sc !== dc) return { ok: false, reason: 'code spans altered' };

  // AC9：译文不得回吐围栏内容
  if (fenceTexts) {
    for (var f = 0; f < fenceTexts.length; f++) {
      var t = fenceTexts[f].trim();
      if (t && !/^(```|~~~)/.test(t) && dst.indexOf(t) !== -1) {
        return { ok: false, reason: 'code fence echoed into translation' };
      }
    }
  }
  return { ok: true };
}

/* ══════════════════════════════════════════════════════════════════
   State
   ══════════════════════════════════════════════════════════════════ */

var state = {
  mode: 'below',
  running: false,
  timer: null,
  queue: [],
  index: 0,
  // key = groupId + ':' + segmentIndex → {state, text, reason}
  seg: {}
};

var $ = function (id) { return document.getElementById(id); };
var toastTimer = null;
function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
}

function fakeAddress(text, seed) {
  var h = 2166136261;
  for (var i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  var b = '0123456789abcdefghijklmnopqrstuvwxyz', out = '', v = h + seed;
  for (var k = 0; k < 5; k++) { out += b[v % 36]; v = Math.floor(v / 36) + 7; }
  return 'c' + out;
}

/* 可翻译段（prose + tag），code/fence/blank 不进队列 */
function translatableSegments() {
  var out = [];
  GROUPS.forEach(function (g) {
    if (SKIP_BLOCK_KINDS[g.kind]) return;
    g.segments.forEach(function (s, si) {
      if (s.kind === 'prose' || s.kind === 'tag') {
        out.push({ group: g, segIndex: si, seg: s, key: g.id + ':' + si });
      }
    });
  });
  return out;
}

function countCodeSegments() {
  var n = 0;
  GROUPS.forEach(function (g) {
    if (SKIP_BLOCK_KINDS[g.kind]) return;
    g.segments.forEach(function (s) { if (s.kind === 'code' || s.kind === 'fence') n++; });
  });
  return n;
}

/* ══════════════════════════════════════════════════════════════════
   Render
   ══════════════════════════════════════════════════════════════════ */

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderGutter() {
  var g = $('gutter'), html = '';
  for (var i = 0; i < SRC.length; i++) {
    html += '<div class="row">' + (i + 1) + '</div>';
    var grp = GROUP_OF_LINE[i];
    if (state.mode === 'below' && grp && grpHasTranslation(grp)) html += '<div class="row">·</div>';
  }
  g.innerHTML = html;
}

function grpHasTranslation(grp) {
  return grp.segments.some(function (s, si) {
    var u = state.seg[grp.id + ':' + si];
    return u && (u.state === 'done' || u.state === 'failed' || u.state === 'inflight');
  });
}

function segKindOfLine(lineIndex) {
  var grp = GROUP_OF_LINE[lineIndex];
  if (!grp) return null;
  // 该行在组内是第几行 → 找到覆盖它的 segment
  var offset = 0;
  for (var i = 0; i < grp.lineIndexes.length; i++) {
    if (grp.lineIndexes[i] === lineIndex) break;
    offset += SRC[grp.lineIndexes[i]].lines.length;
  }
  var acc = 0;
  for (var s = 0; s < grp.segments.length; s++) {
    var seg = grp.segments[s];
    if (offset >= acc && offset < acc + 1) return { seg: seg, segIndex: s, grp: grp };
    acc += 1;
  }
  return { seg: grp.segments[0], segIndex: 0, grp: grp };
}

function renderCode() {
  var host = $('code');
  var html = '';

  for (var i = 0; i < SRC.length; i++) {
    var line = SRC[i];

    if (line.t === 'blank') { html += '<div class="row">&nbsp;</div>'; continue; }
    if (line.t === 'code') { html += '<div class="row">' + line.html + '</div>'; continue; }

    // 注释行
    var info = segKindOfLine(i);
    var grp = info.grp, seg = info.seg, segIndex = info.segIndex;
    var key = grp.id + ':' + segIndex;
    var unit = state.seg[key];
    var blockSkipped = !!SKIP_BLOCK_KINDS[grp.kind];

    var lineCls = 'row';
    var hoverable = state.mode === 'hover' && !blockSkipped &&
                    (seg.kind === 'prose' || seg.kind === 'tag') && unit && unit.state === 'done';
    if (hoverable) lineCls += ' hoverable';

    html += '<div class="' + lineCls + '">';

    // 原文：按 segment kind 加视觉区分
    for (var li = 0; li < line.lines.length; li++) {
      var rawLine = line.lines[li];
      var kindCls = 'seg-' + (blockSkipped ? 'prose' : seg.kind);
      if (li > 0) html += '<br>';
      html += '<span class="cmt-src ' + kindCls + '">' + escapeHtml(rawLine) + '</span>';
    }

    // code/fence 段标记（让用户看到「这段不翻」）
    if (!blockSkipped && (seg.kind === 'code' || seg.kind === 'fence')) {
      html += '<span class="seg-mark ' + seg.kind + '">代码 · 不翻</span>';
    }

    // 跳过原因
    if (blockSkipped) {
      html += '<span class="skip-chip" title="' + escapeHtml(SKIP_REASON[grp.kind] || '') + '">' +
              '跳过 · ' + KIND_LABEL[grp.kind] + '</span>';
    }

    // 行内译文
    if (state.mode === 'inline' && unit && unit.state === 'done') {
      html += '<span class="tr-inline">' + escapeHtml(unit.text) + '</span>';
    }
    if (state.mode === 'inline' && unit && unit.state === 'inflight') {
      html += '<span class="tr-shimmer"></span>';
    }
    if (state.mode === 'inline' && unit && unit.state === 'failed') {
      html += '<span class="tr-fail" data-retry="' + key + '">⚠ ' + escapeHtml(unit.reason) + ' · 重试</span>';
    }

    // 悬停译文
    if (state.mode === 'hover' && unit && unit.state === 'done') {
      html += '<span class="tr-hover">' + escapeHtml(unit.text) + '</span>';
    }

    // 失败 chip（非 inline）
    if (state.mode !== 'inline' && unit && unit.state === 'failed') {
      html += '<span class="tr-fail" data-retry="' + key + '">⚠ ' + escapeHtml(unit.reason) + ' · 重试</span>';
    }

    html += '</div>';
  }

  // below 模式：每组结束后输出一个译文块（只含已译段）
  if (state.mode === 'below') {
    html = insertBelowWidgets(html);
  }

  host.innerHTML = html;

  var retries = host.querySelectorAll('[data-retry]');
  for (var r = 0; r < retries.length; r++) {
    retries[r].addEventListener('click', (function (k) {
      return function () { retrySeg(k); };
    })(retries[r].getAttribute('data-retry')));
  }
}

/**
 * below 模式：在每个组的最后一行之后插入译文 widget。
 * 在每个组内，只输出 prose/tag 段的译文；code/fence/blank 段以原文行占位，保持行对应。
 */
function insertBelowWidgets(html) {
  // 逐组独立处理，避免跨组串扰
  GROUPS.forEach(function (grp) {
    if (SKIP_BLOCK_KINDS[grp.kind]) return;
    if (!grpHasTranslation(grp)) return;

    var lastLineIndex = grp.lineIndexes[grp.lineIndexes.length - 1];
    var marker = '<!--END:' + lastLineIndex + '-->';

    // 在最后一个 <div class="row ...">...</div> 后插入
    var body = '';
    grp.segments.forEach(function (s, si) {
      var u = state.seg[grp.id + ':' + si];

      // 代码/围栏段：源码里已经可见，译文块里**不复述内容**，只用紧凑占位标记
      // （复述会让译文块变成源码副本，纯噪声；标记保证读者知道此处跳过了代码）
      if (s.kind === 'code' || s.kind === 'fence') {
        body += '<div><span class="code-gap">⟨' + (s.kind === 'fence' ? '代码围栏' : '代码') +
                ' · 原样保留⟩</span></div>';
        return;
      }
      if (s.kind === 'blank') return;
      if (!u) return;
      if (u.state === 'done') {
        body += '<div>' + escapeHtml(u.text) + '</div>';
      } else if (u.state === 'inflight') {
        body += '<div><span class="tr-shimmer" style="margin-left:0"></span></div>';
      }
    });
    if (!body) return;

    var widget = '<div class="tr-below"><div class="tr-body">' + body + '</div></div>';
    var needle = '<div class="row">&nbsp;</div>';
    // 用行号定位：把 widget 插到该行对应 <div class="row"> 之后
    var idx = nthRowIndex(html, lastLineIndex);
    if (idx === -1) return;
    var closeIdx = html.indexOf('</div>', idx);
    if (closeIdx === -1) return;
    html = html.slice(0, closeIdx + 6) + widget + html.slice(closeIdx + 6);
  });
  return html;
}

/** 找到第 n 个 <div class="row ..."> 的起始下标（row 与 SRC 行一一对应） */
function nthRowIndex(html, n) {
  var pos = -1, count = -1;
  while (true) {
    var next = html.indexOf('<div class="row', pos + 1);
    if (next === -1) return -1;
    count++;
    if (count === n) return next;
    pos = next;
  }
}

function renderInspect() {
  var host = $('inspect-body');
  var html = '<div class="layer-hint">组 → 段（只有 prose/tag 送模型）</div>';

  GROUPS.forEach(function (grp) {
    var skipped = !!SKIP_BLOCK_KINDS[grp.kind];
    var addr = fakeAddress(grp.lines.join('\n'), grp.id.length * 31);

    html += '<div class="grp-card">';
    html += '<div class="grp-card-head">';
    html += '<span class="grp-ln">L' + (grp.lineIndexes[0] + 1) + '–' + (grp.lineIndexes[grp.lineIndexes.length - 1] + 1) + '</span>';
    html += '<span class="grp-kind ' + grp.kind + '">' + KIND_LABEL[grp.kind] + '</span>';
    html += '<span style="font-size:9px;color:var(--muted-strong);font-family:var(--font-mono)">' + grp.node + '</span>';
    html += '<span class="spacer"></span>';
    html += '<span class="grp-addr">' + addr + '</span>';
    html += '</div>';

    html += '<div class="seg-list">';
    grp.segments.forEach(function (s, si) {
      var key = grp.id + ':' + si;
      var u = state.seg[key];
      var isTranslatable = (s.kind === 'prose' || s.kind === 'tag') && !skipped;
      var sentMark = skipped ? '—' : (isTranslatable ? (u ? (u.state === 'done' ? '✓' : (u.state === 'failed' ? '✗' : '⋯')) : '·') : '—');
      html += '<div class="seg-item' + (isTranslatable ? '' : ' skipped') + '">';
      html += '<span class="tag ' + s.kind + '">' + s.kind + '</span>';
      html += '<span class="txt">' + escapeHtml(s.text.slice(0, 42) || '(blank)') + '</span>';
      html += '<span class="sent' + (isTranslatable ? ' yes' : '') + '">' + sentMark + '</span>';
      html += '</div>';
    });
    html += '</div></div>';
  });

  host.innerHTML = html;
}

function renderStats() {
  var done = 0, fail = 0;
  for (var k in state.seg) {
    if (state.seg[k].state === 'done') done++;
    if (state.seg[k].state === 'failed') fail++;
  }
  var skip = 0;
  GROUPS.forEach(function (g) { if (SKIP_BLOCK_KINDS[g.kind]) skip += g.segments.length; });

  $('st-done').textContent = String(done);
  $('st-code').textContent = String(countCodeSegments());
  $('st-skip').textContent = String(skip);
  $('st-fail').textContent = String(fail);
  $('btn-stop').disabled = !state.running;
  $('btn-translate').disabled = state.running;
}

function render() { renderGutter(); renderCode(); renderInspect(); renderStats(); }

/* ══════════════════════════════════════════════════════════════════
   Actions
   ══════════════════════════════════════════════════════════════════ */

function startJob() {
  if (state.running) return;
  var queue = translatableSegments().filter(function (item) {
    var u = state.seg[item.key];
    return !u || u.state !== 'done';
  });
  if (queue.length === 0) { toast('所有可翻译段已完成（代码段与跳过类不参与）'); return; }
  state.running = true;
  state.queue = queue;
  state.index = 0;
  render();
  pump();
}

function pump() {
  if (!state.running) return;
  if (state.index >= state.queue.length) { finishJob(); return; }

  var item = state.queue[state.index];
  state.seg[item.key] = { state: 'inflight' };
  render();

  state.timer = setTimeout(function () {
    var src = item.seg.text;
    var text = TRANSLATIONS[src];

    if (!text) {
      state.seg[item.key] = { state: 'done', text: '（译文）' + src };
      state.index++; render(); pump(); return;
    }

    var fences = [];
    item.group.segments.forEach(function (s) { if (s.kind === 'fence') fences.push(s.text); });
    var verdict = verifySegment(src, text, fences);

    state.seg[item.key] = verdict.ok
      ? { state: 'done', text: text }
      : { state: 'failed', reason: verdict.reason };
    state.index++; render(); pump();
  }, 380);
}

function finishJob() {
  state.running = false;
  if (state.timer) { clearTimeout(state.timer); state.timer = null; }
  var fail = 0;
  for (var k in state.seg) if (state.seg[k].state === 'failed') fail++;
  toast(fail > 0 ? ('完成：' + fail + ' 段校验失败，可单段重试')
                 : '注释翻译完成（代码段已原样保留）');
  render();
}

function stopJob() {
  if (!state.running) return;
  state.running = false;
  if (state.timer) { clearTimeout(state.timer); state.timer = null; }
  for (var k in state.seg) if (state.seg[k].state === 'inflight') delete state.seg[k];
  toast('已停止 —— 已完成译文保留');
  render();
}

function retrySeg(key) {
  var u = state.seg[key];
  var reason = u ? u.reason : '';
  var item = translatableSegments().filter(function (x) { return x.key === key; })[0];
  if (!item) return;

  state.seg[key] = { state: 'inflight' };
  render();

  setTimeout(function () {
    var src = item.seg.text;
    var text = RETRY[src];
    if (!text) { state.seg[key] = { state: 'failed', reason: 'no retry script' }; render(); return; }
    var fences = [];
    item.group.segments.forEach(function (s) { if (s.kind === 'fence') fences.push(s.text); });
    var verdict = verifySegment(src, text, fences);
    if (verdict.ok) {
      state.seg[key] = { state: 'done', text: text };
      toast('重试成功：' + reason + ' 已修复');
    } else {
      state.seg[key] = { state: 'failed', reason: verdict.reason };
      toast('重试仍失败：' + verdict.reason);
    }
    render();
  }, 460);
}

function setMode(mode) {
  state.mode = mode;
  var btns = $('seg-mode').querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) {
    btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-mode') === mode ? 'true' : 'false');
  }
  render();
  toast({
    below: '对照：组下方追加译文块（默认）',
    inline: '行内：段尾追加译文',
    hover: '悬停：译文在浮层里',
    off: '关闭：只显示原文（代码段仍有紫色底纹标识）'
  }[mode]);
}

function init() {
  $('btn-translate').addEventListener('click', startJob);
  $('btn-stop').addEventListener('click', stopJob);

  var btns = $('seg-mode').querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', (function (b) {
      return function () { setMode(b.getAttribute('data-mode')); };
    })(btns[i]));
  }

  $('sel-lang').addEventListener('change', function (e) {
    toast('目标语言 → ' + e.target.value + '：缓存键含语言');
  });

  render();

  ['gutter', 'code', 'inspect-body', 'btn-translate', 'btn-stop', 'seg-mode'].forEach(function (id) {
    if (!$(id)) console.error('[prototype] missing node:', id);
  });
  console.log('[prototype] groups:', GROUPS.length,
              '| translatable segments:', translatableSegments().length,
              '| code/fence segments (never sent):', countCodeSegments());
}

init();
</script>
</body>
</html>
