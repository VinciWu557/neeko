# dsh-neeko bundle patch: the rows that turn a profile into either the Neeko
# bridge or the interactive TUI — the CLI/daemon startup provider, the bridge
# runtime, and the TUI runner. The startup row is always mounted; the bridge
# and TUI rows are mutually exclusive via `disabled: !!js` conditions (the
# same conditional-entry mechanism dsh-base's own patch uses), so exactly one
# of them runs per invocation: `--tui` selects the TUI, anything else the bridge.

- insert:
    - id: neeko-startup
      name: 'dsh-neeko/startup'

    - id: neeko
      name: 'dsh-neeko'
      inject: [neekoStartup]
      disabled: !!js (function(){ try { return ctx.get('cmdlineArgs').get().includes('--tui') } catch { return false } })()
      config:
        daemon: !!js ctx.neekoStartup.daemon ?? false
        host: !!js ctx.neekoStartup.host ?? '127.0.0.1'
        port: !!js ctx.neekoStartup.port ?? 3081
        sessionId: !!js ctx.neekoStartup.sessionId
        autoSpawn: !!js ctx.neekoStartup.autoSpawn ?? true
        spawnCommand: !!js ctx.neekoStartup.spawnCommand

    - id: neeko-tui
      name: 'dsh-neeko/tui'
      inject: [neekoStartup]
      disabled: !!js (function(){ try { return !ctx.get('cmdlineArgs').get().includes('--tui') } catch { return true } })()
      config:
        daemon: !!js ctx.neekoStartup.daemon ?? false
        host: !!js ctx.neekoStartup.host ?? '127.0.0.1'
        port: !!js ctx.neekoStartup.port ?? 3081
        sessionId: !!js ctx.neekoStartup.sessionId
        tui: !!js ctx.neekoStartup.tui === true
